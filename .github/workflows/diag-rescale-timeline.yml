# Throwaway diagnostic workflow for FLINK-40789 (fork only, do not upstream).
name: "Diag RescaleTimelineITCase"
on:
  push:
    branches: [FLINK-40789-rescale-diagnostics]
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of test repetitions"
        default: "10"
permissions: read-all
jobs:
  diag:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Instance details
        run: |
          mkdir -p diag
          { echo "== nproc"; nproc; echo "== lscpu"; lscpu; echo "== free -m"; free -m; echo "== df -h"; df -h; echo "== uname"; uname -a; echo "== java"; java -version 2>&1; } | tee diag/instance.txt
      - name: Start resource sampler
        run: nohup .github/diag/sample.sh diag/resources.csv > /dev/null 2>&1 &
      - name: Build flink-runtime
        run: ./mvnw -B install -DskipTests -Dfast -Pskip-webui-build -Djdk17 -Pjava17-target -pl flink-runtime -am -T1C
      - name: Run test repeatedly
        run: |
          runs="${{ github.event.inputs.runs || '10' }}"
          : > diag/results.txt
          for i in $(seq 1 "$runs"); do
            echo "RUN $i start $(date +%s.%N)" | tee -a diag/timing.txt
            if ./mvnw -B -pl flink-runtime -Djdk17 -Pjava17-target -Dtest=RescaleTimelineITCase -DfailIfNoTests=false -Dcheckstyle.skip -Drat.skip -Dspotless.check.skip=true test > diag/run-$i.log 2>&1; then
              echo "RUN $i PASS" >> diag/results.txt
            else
              echo "RUN $i FAIL" >> diag/results.txt
            fi
            echo "RUN $i end $(date +%s.%N)" >> diag/timing.txt
            grep -h "TIMING" flink-runtime/target/surefire-reports/*RescaleTimelineITCase*-output.txt diag/run-$i.log 2>/dev/null | sed "s/^/run$i: /" | sort -u >> diag/timing.txt
          done
          cat diag/results.txt
      - name: Stop sampler and summarize
        if: always()
        run: |
          pkill -f sample.sh || true
          echo "## Results" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' diag/results.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "## Timings" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; grep TIMING diag/timing.txt >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: |
            diag/
            flink-runtime/target/surefire-reports/
